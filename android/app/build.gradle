plugins {
    id 'com.android.application'
}

android {
    namespace 'com.twitsticker.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.twitsticker.app"
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Authority for WhatsApp Sticker Content Provider
        def stickerAuthority = "com.twitsticker.app.stickercontentprovider"
        manifestPlaceholders = [contentProviderAuthority: stickerAuthority]
        buildConfigField("String", "CONTENT_PROVIDER_AUTHORITY", "\"${stickerAuthority}\"")
    }

    signingConfigs {
        release {
            storeFile file('twitsticker-upload.jks')
            storePassword 'twitsticker123'
            keyAlias 'twitsticker'
            keyPassword 'twitsticker123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    aaptOptions {
        noCompress "webp"
        noCompress "png"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

