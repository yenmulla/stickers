plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.twitsticker.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.twitsticker.app"
        minSdk 24
        targetSdk 37
        versionCode 5
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Authority for WhatsApp Sticker Content Provider
        def stickerAuthority = "com.twitsticker.app.stickercontentprovider"
        manifestPlaceholders = [contentProviderAuthority: stickerAuthority]
        buildConfigField("String", "CONTENT_PROVIDER_AUTHORITY", "\"${stickerAuthority}\"")
    }

    signingConfigs {
        release {
            storeFile file('twitsticker-upload.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: project.findProperty('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: project.findProperty('KEY_ALIAS') ?: 'twitsticker'
            keyPassword System.getenv('KEY_PASSWORD') ?: project.findProperty('KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    aaptOptions {
        noCompress "webp"
        noCompress "png"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Firebase Cloud Messaging (Push Notifications) & Analytics
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // Native Google Account Picker (1-tap Google Sign-In without password prompts in WebView)
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
